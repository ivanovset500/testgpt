<h1>Справочник «Пробы драгоценных металлов»</h1>
<p class="Usual">Справочник предназначен для хранения списка проб драгоценных металлов, используемых при заполнении сведений о ювелирном изделии, поступающем в залог.</p>
<p class="Usual">Для каждой пробы должен быть указан владелец - <a href="Catalog.ЛБ_ДрагоценныеМеталлы/Help">драгоценный металл</a>, к которому проба относится.</p></body></html>
